<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería Docker</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    header { padding: 2rem 1rem; text-align: center; background: #1e293b; }
    header h1 { margin: 0 0 .25rem; }
    header p { margin: 0; color: #94a3b8; }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
    figure { margin: 0; background: #1e293b; border-radius: 12px; overflow: hidden; }
    img { width: 100%; display: block; }
    figcaption { padding: .75rem 1rem; font-weight: 600; }
    footer { text-align: center; padding: 1rem; color: #64748b; font-size: .9rem; }
  </style>
</head>
<body>
  <header>
    <h1>Galería contenerizada</h1>
    <p>Aplicación Flask corriendo dentro de un contenedor Docker</p>
  </header>
  <main>
    {% for img in imagenes %}
    <figure>
      <img src="{{ url_for('static', filename='img/' ~ img.archivo) }}" alt="{{ img.titulo }}">
      <figcaption>{{ img.titulo }}</figcaption>
    </figure>
    {% endfor %}
  </main>
  <footer>Examen de Docker · Ingeniería de Software · Uniempresarial</footer>
</body>
</html>
